name: Daily NewsU curation

on:
  schedule:
    # 08:00 UTC ≈ 4am US Eastern / 1am US Pacific — early enough to be ready
    # before most users' morning notification. Adjust to taste; GitHub Actions
    # cron is always UTC.
    - cron: "0 8 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the generated brief back to the repo

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run curation pipeline
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node curate.js > ../public/brief-latest.json

      - name: Validate output is valid JSON before publishing
        run: python3 -c "import json; json.load(open('public/brief-latest.json')); print('OK')"

      - name: Commit and push the updated brief
        run: |
          git config user.name "newsu-curation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/brief-latest.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Daily brief: $(date -u +%Y-%m-%d)"
          git push
