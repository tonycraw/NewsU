name: NewsU
options:
  bundleIdPrefix: com.newsu.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # NewsU.xcodeproj sits directly at the project root (same level as
  # Subscription.storekit), so scheme file references need one extra
  # "../" beyond XcodeGen's default to reach it from xcshareddata/xcschemes/.
  schemePathPrefix: "../../../"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  NewsU:
    type: application
    platform: iOS
    sources:
      - path: NewsU
    resources:
      - path: NewsU/Resources
    info:
      path: NewsU/Supporting/Info.plist
      properties:
        CFBundleDisplayName: NewsU
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserNotificationsUsageDescription: "NewsU sends one gentle reminder each morning to open your Daily Brief — prayer, verses, and the news that matters to you."
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newsu.app
        PRODUCT_NAME: NewsU
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
    capabilities:
      com.apple.BackgroundModes: {}
    scheme:
      testTargets: []
      gatherCoverageData: false
      storeKitConfiguration: Subscription.storekit
